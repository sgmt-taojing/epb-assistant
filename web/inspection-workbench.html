<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>执法检查工作台 · 环保执法助手</title>
<style>
:root{
  --bg:#f4f7f5; --card:#fff; --ink:#15281f; --muted:#5c7268;
  --green:#1a7a52; --green-bg:#e7f3ed; --dark:#0e3524;
  --red:#b03636; --red-bg:#fbeeee; --amber:#8a6116; --amber-bg:#faf3e3;
  --blue:#2b5fad; --blue-bg:#edf3fb; --line:#dbe6e0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;padding:20px 14px 60px}
.wrap{max-width:860px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
h1{font-size:21px;color:var(--dark)}
h1 small{display:block;font-size:12.5px;color:var(--muted);font-weight:400;margin-top:2px}
.back{font-size:13px;color:var(--green);text-decoration:none;background:var(--green-bg);padding:6px 14px;border-radius:99px}
.steps{display:flex;gap:6px;margin:18px 0;flex-wrap:wrap}
.step-tag{flex:1;min-width:130px;text-align:center;padding:9px 6px;border-radius:10px;background:var(--card);border:1.5px solid var(--line);font-size:12.8px;color:var(--muted)}
.step-tag.active{border-color:var(--green);background:var(--green-bg);color:var(--dark);font-weight:700}
.step-tag.done{border-color:#b5d9c6;background:#f0f8f4;color:var(--green)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:14px}
h2{font-size:16.5px;color:var(--dark);margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:14px;background:#fbfdfc}
textarea{resize:vertical;min-height:70px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:inline-block;padding:11px 22px;border-radius:10px;border:none;background:var(--green);color:#fff;font:inherit;font-size:14.5px;font-weight:650;cursor:pointer;margin-top:14px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--green);border:1.5px solid var(--green)}
.btn.block{width:100%;text-align:center}
.item{border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin:9px 0;background:#fbfdfc}
.item .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item .name{font-weight:650;font-size:14.3px}
.item .detail{margin-top:8px}
.item input[type=text]{margin-top:6px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:650;white-space:nowrap;flex-shrink:0}
.b-high{background:var(--red-bg);color:var(--red)}
.b-mid{background:var(--amber-bg);color:var(--amber)}
.b-low{background:var(--green-bg);color:var(--green)}
.radios{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:5px;margin:0;font-size:13.2px;color:var(--ink);cursor:pointer}
.radios input{width:auto}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.meta{background:#f6faf8;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.meta .num{font-size:21px;font-weight:750;color:var(--green)}
.meta .num.red{color:var(--red)}
.meta .lbl{font-size:12px;color:var(--muted)}
.law{background:#f6faf8;border:1px solid var(--line);border-radius:9px;padding:9px 13px;margin:7px 0;font-size:13.2px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.law .score{color:var(--muted);font-size:12px;flex-shrink:0}
.doc-box{background:var(--green-bg);border:1px solid #b5d9c6;border-radius:11px;padding:15px 18px;margin-top:10px}
.doc-box.fail{background:var(--amber-bg);border-color:#ecd9a8}
.doc-box a{color:var(--green);font-weight:650}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:11px 22px;border-radius:99px;font-size:13.5px;opacity:0;transition:.3s;pointer-events:none;max-width:88vw}
.toast.show{opacity:1}
.hint{font-size:12.3px;color:var(--muted);margin-top:6px}
.hide{display:none}
@media(max-width:560px){.row{grid-template-columns:1fr}.card{padding:17px 15px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🚔 执法检查工作台<small>生成清单 → 现场核查 → 提交定案 · 端到端</small></h1>
  <a class="back" href="/index.html">← 返回首页</a>
</header>

<div class="steps">
  <div class="step-tag active" id="st1">① 检查准备</div>
  <div class="step-tag" id="st2">② 现场核查</div>
  <div class="step-tag" id="st3">③ 定案与文书</div>
</div>

<!-- 步骤1：检查准备 -->
<div class="card" id="card1">
  <h2>① 检查准备</h2>
  <label>企业名称（选填，可从库中匹配）</label>
  <input id="ent" placeholder="如：鲁药东营制药有限公司（留空则现场录入）">
  <div class="row">
    <div>
      <label>检查类型</label>
      <select id="insp">
        <option value="water">水污染防治</option>
        <option value="air">大气污染防治</option>
        <option value="solid">固体废物污染防治</option>
        <option value="permit">排污许可</option>
        <option value="eia">环评审批验收</option>
        <option value="monitor">自动监控</option>
        <option value="noise">噪声污染防治</option>
        <option value="mobile">移动源监管</option>
        <option value="radiation">辐射安全</option>
        <option value="soil">土壤污染防治</option>
        <option value="eco">生态保护</option>
        <option value="emergency">环境应急</option>
      </select>
    </div>
    <div>
      <label>执法人员姓名</label>
      <input id="inspector" placeholder="至少2人执法，填主办人">
    </div>
  </div>
  <button class="btn block" id="btn-gen" onclick="genChecklist()">生成检查清单（知识库驱动）</button>
  <p class="hint">清单依据本地知识库 33 类违法查处规程自动生成，含风险等级与取证要求。</p>
</div>

<!-- 步骤2：现场核查 -->
<div class="card hide" id="card2">
  <h2>② 现场核查 <span id="chk-meta" style="font-size:13px;color:var(--muted);font-weight:400"></span></h2>
  <div id="items"></div>
  <label>检查备注（现场处理情况等）</label>
  <textarea id="notes" placeholder="如：已责令停止排放，暗管已现场拍照取证"></textarea>
  <button class="btn block" id="btn-submit" onclick="submitInspection()">提交检查结果（自动分析+法条+文书+立案）</button>
  <p class="hint">提交后系统自动：KB 法条匹配 → 生成案情 → 生成执法文书（docx）→ 案件入库。</p>
</div>

<!-- 步骤3：定案与文书 -->
<div class="card hide" id="card3">
  <h2>③ 定案与文书</h2>
  <div class="meta-grid" id="sum"></div>
  <h2 style="font-size:14.5px;margin-top:16px">📌 案情摘要</h2>
  <p id="fact" style="font-size:13.8px;background:#f6faf8;border:1px solid var(--line);border-radius:9px;padding:11px 14px"></p>
  <h2 style="font-size:14.5px;margin-top:16px">⚖ 知识库法条与案例支撑</h2>
  <div id="laws"></div>
  <div id="docarea"></div>
  <button class="btn ghost block" onclick="location.reload()">开始下一次检查</button>
</div>
</div>

<div class="toast" id="toast"></div>
<script>
var CHK=null, INSPECTOR='';
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2600)}
function setStep(n){[1,2,3].forEach(function(i){var el=document.getElementById('st'+i);el.classList.remove('active','done');if(i<n)el.classList.add('done');if(i===n)el.classList.add('active')})}

async function genChecklist(){
  var btn=document.getElementById('btn-gen');
  var ent=document.getElementById('ent').value.trim();
  var insp=document.getElementById('insp').value;
  INSPECTOR=document.getElementById('inspector').value.trim();
  btn.disabled=true;btn.textContent='生成中…';
  try{
    var r=await fetch('/api/inspection/checklist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enterprise:ent,inspection_type:insp})});
    var d=await r.json();
    if(!d.ok){toast(d.error||'清单生成失败');btn.disabled=false;btn.textContent='生成检查清单（知识库驱动）';return}
    CHK=d;
    document.getElementById('chk-meta').textContent='— '+d.enterprise+' · '+d.inspection_type_name+' · '+d.total_items+'项';
    var h='';
    d.check_items.forEach(function(it,i){
      var cls=it.risk_level==='高风险'?'b-high':it.risk_level==='中风险'?'b-mid':'b-low';
      h+='<div class="item" data-i="'+i+'">'
        +'<div class="top"><div class="name">'+(i+1)+'. '+it.check_point+'</div><span class="badge '+cls+'">'+it.risk_level+'</span></div>'
        +'<div class="radios">'
        +'<label><input type="radio" name="r'+i+'" value="normal" checked>正常</label>'
        +'<label><input type="radio" name="r'+i+'" value="abnormal">异常</label>'
        +'<label><input type="radio" name="r'+i+'" value="na">不涉及</label>'
        +'</div>'
        +'<div class="detail hide"><input type="text" placeholder="异常详情（现场情况、数据、位置等）" data-detail="'+i+'"></div>'
        +'</div>';
    });
    document.getElementById('items').innerHTML=h;
    document.getElementById('items').addEventListener('change',function(e){
      if(e.target.type==='radio'){
        var det=e.target.closest('.item').querySelector('.detail');
        if(e.target.value==='abnormal'){det.classList.remove('hide')}else{det.classList.add('hide')}
      }
    });
    document.getElementById('card1').classList.add('hide');
    document.getElementById('card2').classList.remove('hide');
    setStep(2);
    toast('✅ 清单已生成：'+d.total_items+' 项检查点');
  }catch(e){
    toast('网络异常：'+e.message);
  }
  btn.disabled=false;btn.textContent='生成检查清单（知识库驱动）';
}

async function submitInspection(){
  var btn=document.getElementById('btn-submit');
  btn.disabled=true;btn.textContent='提交中…（分析+文书+立案）';
  try{
    var findings=[];
    document.querySelectorAll('#items .item').forEach(function(el){
      var i=el.dataset.i;
      var res=el.querySelector('input[type=radio]:checked');
      var det=el.querySelector('[data-detail]');
      findings.push({
        check_point:CHK.check_items[i].check_point,
        result:res?res.value:'normal',
        detail:det?det.value.trim():'',
        risk_level:CHK.check_items[i].risk_level
      });
    });
    var r=await fetch('/api/inspection/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      checklist_id:CHK.checklist_id, enterprise:CHK.enterprise, inspection_type:CHK.inspection_type,
      inspector:INSPECTOR, findings:findings, notes:document.getElementById('notes').value.trim()
    })});
    var d=await r.json();
    if(!d.ok){toast(d.error||'提交失败');btn.disabled=false;btn.textContent='提交检查结果（自动分析+法条+文书+立案）';return}
    renderResult(d);
    document.getElementById('card2').classList.add('hide');
    document.getElementById('card3').classList.remove('hide');
    setStep(3);
  }catch(e){
    toast('网络异常：'+e.message);
    btn.disabled=false;btn.textContent='提交检查结果（自动分析+法条+文书+立案）';
  }
}

function renderResult(d){
  var s=d.summary;
  document.getElementById('sum').innerHTML=
    '<div class="meta"><div class="num">'+s.total_items+'</div><div class="lbl">检查项</div></div>'
    +'<div class="meta"><div class="num '+(s.abnormal_items>0?'red':'')+'">'+s.abnormal_items+'</div><div class="lbl">异常项</div></div>'
    +'<div class="meta"><div class="num">'+s.compliant_items+'</div><div class="lbl">合规项</div></div>'
    +'<div class="meta"><div class="num" style="font-size:15px;margin-top:4px">'+s.risk_level+'</div><div class="lbl">综合风险</div></div>';
  document.getElementById('fact').textContent=d.fact_text;
  document.getElementById('laws').innerHTML=(d.law_matches&&d.law_matches.length)
    ? d.law_matches.map(function(m){return '<div class="law"><span>'+m.title+'</span><span class="score">匹配 '+Math.round(m.score*100)+'%</span></div>'}).join('')
    : '<p class="hint">未匹配到高置信法条，建议人工复核。</p>';
  var doc=d.document;
  var dh='';
  if(doc.ok){
    dh='<div class="doc-box">📄 '+doc.doc_name+' 已生成：<a href="'+doc.download_url+'" download>'+doc.filename+'</a>'
      +'<div class="hint">案件编号 '+d.case_id+' · 执法人 '+d.inspector+' · '+d.inspected_at+'</div></div>';
  }else{
    dh='<div class="doc-box fail">⚠️ 文书未自动生成（'+(doc.error||'未知原因')+'），案情已入库（案件编号 '+d.case_id+'），可稍后在文书工作台补生成。</div>';
  }
  document.getElementById('docarea').innerHTML=dh;
}
</script>
<script src="global-sidebar.js"></script>
<script src="voice-assistant.js"></script>
<script src="ai-assistant.js"></script>
</body>
</html>
