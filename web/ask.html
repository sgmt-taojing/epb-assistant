<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>环保智能问答 · 全员统一入口</title>
<link rel="canonical" href="https://sgmt-taojing.github.io/epb-assistant/ask.html">
<style>
:root{
  --bg:#f4f7f5; --card:#fff; --ink:#15281f; --muted:#5c7268;
  --green:#1a7a52; --green-bg:#e7f3ed; --dark:#0e3524;
  --blue:#2b5fad; --blue-bg:#edf3fb; --amber:#8a6116; --amber-bg:#faf3e3;
  --line:#dbe6e0; --red:#b03636; --red-bg:#fbeeee;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,#0b2e1e,#1a7a52);color:#fff;padding:22px 24px}
.hwrap{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .logo{font-size:24px}
header h1{font-size:19px;letter-spacing:.5px}
header .sub{font-size:12.5px;opacity:.85}
header .stats{margin-left:auto;font-size:12px;background:rgba(255,255,255,.14);padding:4px 12px;border-radius:99px}
main{max-width:920px;margin:0 auto;padding:24px 16px;flex:1;width:100%}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(14,53,36,.05)}
.qbox .hint{font-size:13px;color:var(--muted);margin-bottom:10px}
.inputrow{display:flex;gap:10px}
#q{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;outline:none;transition:border .15s}
#q:focus{border-color:var(--green)}
#btn-ask{background:var(--green);color:#fff;border:none;border-radius:10px;padding:0 22px;font-size:15px;font-weight:600;cursor:pointer}
#btn-ask:disabled{opacity:.55;cursor:wait}
#btn-ask:hover:not(:disabled){background:#156845}
.chips{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--green-bg);color:var(--green);border:1px solid #cde8db;border-radius:99px;padding:4px 13px;font-size:12.8px;cursor:pointer}
.chip:hover{background:#d9efe4}
.status{margin-top:10px;font-size:12.5px;color:var(--muted);min-height:18px}
.status .ok{color:var(--green)}
.status .err{color:var(--red)}
.result{margin-top:16px;display:none}
.result.show{display:block}
.tier{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;padding:3px 11px;border-radius:99px;margin-bottom:10px}
.tier-direct{background:var(--green-bg);color:var(--green)}
.tier-summary{background:var(--blue-bg);color:var(--blue)}
.tier-miss{background:var(--amber-bg);color:var(--amber)}
.ans{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:10px;padding:16px 18px;white-space:pre-wrap;font-size:14.2px;line-height:1.85}
.src{margin-top:10px;font-size:12.5px;color:var(--muted)}
.src b{color:var(--ink)}
.rel{margin-top:14px}
.rel h3{font-size:13.5px;color:var(--dark);margin-bottom:6px}
.rel .item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 13px;font-size:13px;margin-bottom:6px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.rel .item .sc{color:var(--muted);font-size:11.5px;white-space:nowrap}
.rolepanel{margin-top:26px}
.rolepanel h2{font-size:16px;color:var(--dark);margin-bottom:10px}
.famgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.fam{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 16px}
.fam .fh{display:flex;align-items:center;gap:8px;font-weight:650;font-size:14px;margin-bottom:8px;color:var(--dark)}
.fam .fh .cnt{margin-left:auto;font-size:11.5px;color:var(--muted);background:#eef4f0;padding:1px 9px;border-radius:99px}
.role{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;font-size:13px;cursor:pointer;text-decoration:none;color:var(--ink)}
.role:hover{background:var(--green-bg)}
.role .ic{width:22px;text-align:center}
.role .go{margin-left:auto;color:var(--muted);font-size:12px}
footer{background:#0e3524;color:rgba(255,255,255,.75);text-align:center;padding:14px;font-size:12px}
.errbanner{display:none;background:var(--red-bg);border:1px solid #eccaca;color:var(--red);border-radius:10px;padding:10px 14px;font-size:13px;margin-top:12px}
.errbanner.show{display:block}
@media(max-width:640px){ .inputrow{flex-direction:column} #btn-ask{padding:12px} header .stats{display:none} }
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <span class="logo">🌿</span>
    <div>
      <h1>环保智能问答</h1>
      <div class="sub">知识驱动 · 秒级响应 · 答案有出处 — 全体环保从业人员的统一入口</div>
    </div>
    <span class="stats" id="kb-stat">知识库加载中…</span>
  </div>
</header>

<main>
  <div class="qbox">
    <div class="hint">直接输入问题，例如：<b>私设暗管怎么处罚</b> / <b>危废倾倒涉刑吗</b> / <b>监测数据造假判几年</b></div>
    <div class="inputrow">
      <input id="q" type="text" maxlength="200" placeholder="问环保知识：法规、处罚、案例、证据、流程…" autocomplete="off">
      <button id="btn-ask" onclick="ask()">提问</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="status" id="status"></div>
    <div class="errbanner" id="errbanner"></div>
    <div class="result" id="result">
      <span class="tier" id="tier"></span>
      <div class="ans" id="ans"></div>
      <div class="src" id="src"></div>
      <div class="rel" id="rel">
        <h3>相关条目</h3>
        <div id="rel-list"></div>
      </div>
    </div>
  </div>

  <div class="rolepanel">
    <h2>按角色进入专属工作台（6 族 22 类）</h2>
    <div class="famgrid" id="famgrid"></div>
  </div>
</main>

<footer>环保智慧执法平台 · 知识问答 v1.0（本地知识库直答 · 断网可用） · <a href="index.html" style="color:inherit">返回首页</a></footer>

<script src="/epb-roles.js"></script>
<script>
'use strict';
var API = '/api/ask';
var HOT = ['私设暗管怎么处罚','危废倾倒涉刑吗','监测数据造假判几年','大气超标罚多少钱','暗管偷排怎么查证据','油烟扰民怎么办'];

function $(id){ return document.getElementById(id); }
function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }

// 热门问题
(function(){
  var c = $('chips');
  HOT.forEach(function(h){
    var el = document.createElement('span');
    el.className='chip'; el.textContent=h;
    el.onclick=function(){ $('q').value=h; ask(); };
    c.appendChild(el);
  });
})();

// 角色面板
(function(){
  var grid = $('famgrid');
  if(!window.EPB_ROLES) return;
  var fams = {};
  EPB_ROLES.list.forEach(function(r){
    (fams[r.family] = fams[r.family] || []).push(r);
  });
  Object.keys(fams).forEach(function(fam){
    var box = document.createElement('div');
    box.className='fam';
    var head = document.createElement('div');
    head.className='fh';
    head.innerHTML = '<span>👤</span><span>'+esc(fam)+'</span><span class="cnt">'+fams[fam].length+' 类</span>';
    box.appendChild(head);
    fams[fam].forEach(function(r){
      var a = document.createElement('a');
      a.className='role'; a.href=r.home;
      a.innerHTML='<span class="ic">'+r.icon+'</span><span>'+esc(r.name)+'</span><span class="go">'+esc(r.desc)+'</span>';
      box.appendChild(a);
    });
    grid.appendChild(box);
  });
})();

// KB 规模显示
(function(){
  fetch('/api/health').then(function(r){return r.json()}).then(function(d){
    var kb = (d.data_stats && d.data_stats.kb_formal);
    if(kb != null) $('kb-stat').textContent = '知识库 '+kb+' 条';
    else $('kb-stat').textContent = '知识库就绪';
  }).catch(function(){ $('kb-stat').textContent = ''; });
})();

var busy = false;
function ask(){
  if(busy) return;
  var q = $('q').value.trim();
  var st = $('status'), rb = $('errbanner');
  rb.className='errbanner';
  if(!q){ st.innerHTML='<span class="err">请输入问题</span>'; return; }
  busy = true;
  var btn = $('btn-ask');
  btn.disabled = true; btn.textContent = '查询中…';
  st.innerHTML = '本地知识库检索中…';
  var t0 = Date.now();
  fetch(API, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({q:q})
  }).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(d){
    var ms = Date.now() - t0;
    busy=false; btn.disabled=false; btn.textContent='提问';
    if(d.ok === false){
      st.innerHTML='';
      rb.textContent = d.error || d.answer || '查询失败，请稍后重试';
      rb.className='errbanner show';
      return;
    }
    render(d, ms);
    st.innerHTML = '<span class="ok">耗时 '+(d.latency_ms||ms)+'ms · 知识库 '+(d.kb_total||'—')+' 条</span>';
  }).catch(function(e){
    busy=false; btn.disabled=false; btn.textContent='提问';
    st.innerHTML='';
    rb.textContent = '服务暂不可用（'+e.message+'）。本地部署时请确认服务已启动；也可直接检索 <a href="knowledge.html">知识库</a> / <a href="law-library.html">法规库</a> / <a href="case-analysis.html">案例库</a>。';
    rb.className='errbanner show';
  });
}

function render(d, ms){
  var res = $('result');
  res.className='result show';
  var tierMap = {
    direct:['知识库直答','tier-direct'],
    summary:['知识库摘要','tier-summary'],
    miss:['未命中·建议换问法','tier-miss']
  };
  var t = tierMap[d.tier] || tierMap.miss;
  var tierEl = $('tier');
  tierEl.className = 'tier '+t[1];
  tierEl.textContent = t[0] + (d.score ? ' · 匹配度 ' + Math.round(d.score*100) + '%' : '');
  $('ans').textContent = d.answer || '（无内容）';
  // 来源
  var src = $('src');
  if(d.sources && d.sources.length){
    var s0 = d.sources[0];
    src.innerHTML = '<b>来源：</b>'+esc(s0.title)+' <span style="color:var(--muted)">（'+esc(s0.source||'自有知识库')+'）</span>';
  } else {
    src.innerHTML = '<span style="color:var(--muted)">该回答未直接命中知识库条目</span>';
  }
  // 相关条目
  var rels = (d.related && d.related.length) ? d.related : (d.sources && d.sources.length>1 ? d.sources.slice(1) : []);
  var rl = $('rel');
  if(rels.length){
    rl.style.display='block';
    var list = $('rel-list');
    list.innerHTML='';
    rels.forEach(function(r){
      var it = document.createElement('div');
      it.className='item';
      var left = document.createElement('span');
      left.textContent = r.title || '';
      var sc = document.createElement('span');
      sc.className='sc';
      sc.textContent = (r.category||'') + (r.score ? ' · '+Math.round(r.score*100)+'%' : '');
      it.appendChild(left); it.appendChild(sc);
      list.appendChild(it);
    });
  } else {
    rl.style.display='none';
  }
}

// 回车提问
$('q').addEventListener('keydown', function(e){
  if(e.key === 'Enter') ask();
});
</script>
<script src="global-sidebar.js"></script>
<script src="voice-assistant.js"></script>
<script src="ai-assistant.js"></script>
</body>
</html>
