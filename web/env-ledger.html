<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>环保台账 · 语音采集工作台</title>
<style>
:root{--g:#059669;--b:#3b82f6;--a:#f59e0b;--r:#ef4444;--bg:#f6f8f7;--card:#fff;--line:#e2e8f0;--txt:#0f172a;--muted:#64748b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:var(--bg);color:var(--txt);line-height:1.6}
.hero{background:linear-gradient(135deg,#064e3b,#059669);color:#fff;padding:36px 20px;text-align:center}
.hero h1{font-size:22px}
.hero p{font-size:13px;opacity:.85;margin-top:6px}
.container{max-width:900px;margin:-20px auto 0;padding:0 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card h3{font-size:15px;margin-bottom:12px;padding-left:10px;border-left:4px solid var(--g)}
.mic-zone{display:flex;flex-direction:column;align-items:center;padding:20px;background:linear-gradient(135deg,rgba(5,150,105,.06),rgba(59,130,246,.06));border:2px dashed rgba(5,150,105,.35);border-radius:14px}
.mic-btn{width:84px;height:84px;border-radius:50%;border:none;background:linear-gradient(135deg,#059669,#10b981);color:#fff;font-size:34px;cursor:pointer;box-shadow:0 6px 20px rgba(5,150,105,.4);transition:all .3s}
.mic-btn.listening{background:linear-gradient(135deg,#dc2626,#ef4444);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.mic-hint{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}
textarea{width:100%;min-height:70px;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;margin-top:12px;resize:vertical;background:var(--card);color:var(--txt)}
.parsed{margin-top:10px}
.rec{display:inline-flex;align-items:center;gap:6px;background:rgba(5,150,105,.08);border:1px solid rgba(5,150,105,.25);border-radius:8px;padding:6px 12px;margin:4px 4px 0 0;font-size:13px}
.rec b{color:var(--g)}
.save-btn{margin-top:12px;padding:10px 24px;border:none;border-radius:10px;background:var(--g);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th{background:#f1f5f9;text-align:left;padding:8px;font-size:12px;color:var(--muted)}
td{padding:8px;border-bottom:1px solid var(--line)}
.cat{font-size:11px;padding:2px 8px;border-radius:4px;background:rgba(59,130,246,.1);color:var(--b)}
.empty{color:var(--muted);text-align:center;padding:20px;font-size:13px}
.report-btn{padding:10px 20px;border:1px solid var(--b);border-radius:10px;background:rgba(59,130,246,.08);color:var(--b);font-size:13px;cursor:pointer;margin-top:10px}
</style>
</head>
<body>
<div class="hero">
<h1>🎤 环保台账 · 语音采集工作台</h1>
<p>说一句话，台账自动记——药剂投加 / 水量 / 监测数据 / 设备状态 / 危废转移</p>
</div>
<div class="container">

<div class="card">
<h3>🎤 语音/文字采集</h3>
<div class="mic-zone">
<button class="mic-btn" id="mic" onclick="toggleMic()">🎤</button>
<div class="mic-hint">点按说话（连续聆听）或直接在下方输入<br>示例："今天上午加药PAC 120公斤，进水950吨，出水COD 38"</div>
</div>
<textarea id="intake-text" placeholder="也可以直接输入：如 2号风机故障停机，下午已维修"></textarea>
<div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">
<input id="ent-name" placeholder="企业名称（选填）" style="flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px">
<button class="save-btn" onclick="doIntake(false)">🔍 解析</button>
<button class="save-btn" onclick="doIntake(true)">💾 解析并记入台账</button>
</div>
<div class="parsed" id="parsed"></div>
</div>

<div class="card">
<h3>📋 台账记录（最近 50 条 · 实时）</h3>
<div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
<button class="report-btn" onclick="analyzeLedger()">🤖 AI 异常检测</button>
<button class="report-btn" onclick="exportLedger()">📥 导出台账（Excel）</button>
</div>
<div id="analyze-area"></div>
<div id="ledger-list"><div class="empty">加载中…</div></div>
</div>

<div class="card">
<h3>📊 专业报告</h3>
<p style="font-size:13px;color:var(--muted)">基于台账数据自动生成企业环保运行报告（运行台账 · 监测汇总 · 合规评估 · 整改建议四部分，符合执法检查口径）</p>
<button class="report-btn" onclick="genReport()">📄 生成企业环保运行报告</button>
<div id="report-area" style="margin-top:12px"></div>
</div>

</div>
<div class="bottom-nav">
<a class="nav-item" href="index.html">🏠 首页</a>
<a class="nav-item" href="ask.html">🧠 问答</a>
<a class="nav-item active" href="env-ledger.html">📋 台账</a>
<a class="nav-item" href="self-check.html">✅ 自查</a>
<a class="nav-item" href="m-workspace.html">💼 工作台</a>
</div>
<style>
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);z-index:99;padding:6px 0 max(6px, env(safe-area-inset-bottom))}
.nav-item{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:11px}
.nav-item .icon{display:block;font-size:20px}
.nav-item.active{color:var(--g);font-weight:600}
</style>

<script src="api-fallback.js"></script>
<script>
// ═══ 语音采集（Web Speech + 后端解析） ═══
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec = null, listening = false;
function toggleMic(){
  var btn = document.getElementById('mic');
  if(listening){ stopMic(); return; }
  if(!SR){ toast('浏览器不支持语音，请直接输入文字'); return; }
  listening = true;
  btn.classList.add('listening'); btn.textContent = '🔴';
  rec = new SR();
  rec.lang = 'zh-CN'; rec.continuous = true; rec.interimResults = false;
  rec.onresult = function(e){
    var t = '';
    for(var i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal) t += e.results[i][0].transcript;
    }
    if(t){
      var box = document.getElementById('intake-text');
      box.value = (box.value ? box.value + '，' : '') + t.trim();
    }
  };
  rec.onend = function(){ if(listening){ try{rec.start()}catch(e){} } };
  try{ rec.start(); toast('聆听中…说完点按钮停止'); }catch(e){}
}
function stopMic(){
  listening = false;
  var btn = document.getElementById('mic');
  btn.classList.remove('listening'); btn.textContent = '🎤';
  if(rec){ try{rec.stop()}catch(e){} }
  // 自动解析
  doIntake(false);
}
function toast(msg){
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a2332;color:#fff;padding:10px 20px;border-radius:8px;z-index:9999;font-size:13px';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){t.remove()},2500);
}

function doIntake(save){
  var text = document.getElementById('intake-text').value.trim();
  if(!text){ toast('请先说或输入内容'); return; }
  var ent = document.getElementById('ent-name').value.trim();
  fetch('/api/voice_intake', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({text:text, enterprise:ent, save:save?1:0})})
  .then(function(r){return r.json()})
  .then(function(d){
    var box = document.getElementById('parsed');
    if(!d.ok){
      box.innerHTML = '<div style="color:#f59e0b;font-size:13px;padding:8px">⚠️ '+d.error+'</div>'
        + (d.examples?'<div style="font-size:12px;color:var(--muted)">示例：<br>'+d.examples.join('<br>')+'</div>':'');
      return;
    }
    var html = '<div style="font-size:12px;color:var(--muted);margin-bottom:6px">识别到 '+d.records.length+' 条记录'+(d.period&&d.period!='未明确'?'（'+d.period+'）':'')+'：' + (save?' <b style="color:var(--g)">已记入台账</b>':'') + '</div>';
    d.records.forEach(function(r){
      html += '<span class="rec"><span class="cat">'+r.type+'</span> '+r.item+' <b>'+r.value+'</b> '+(r.unit||'')+'</span>';
    });
    box.innerHTML = html;
    if(save) loadLedger();
  })
  .catch(function(){ toast('网络异常'); });
}

function loadLedger(){
  fetch('/api/ledger/recent').then(function(r){return r.json()}).then(function(d){
    var box = document.getElementById('ledger-list');
    if(!d.ok || !d.records.length){
      box.innerHTML = '<div class="empty">暂无台账记录——用上方语音采集记第一条</div>';
      return;
    }
    var html = '<table><tr><th>时间</th><th>类别</th><th>项目</th><th>数值</th><th>记录人</th></tr>';
    d.records.forEach(function(r){
      html += '<tr><td>'+(r.ts||'').slice(5,16)+'</td><td><span class="cat">'+r.category+'</span></td><td>'+r.item+'</td><td><b>'+(r.value||'')+'</b> '+(r.unit||'')+'</td><td style="color:var(--muted)">'+(r.recorder||'')+'</td></tr>';
    });
    html += '</table>';
    box.innerHTML = html;
  }).catch(function(){
    document.getElementById('ledger-list').innerHTML = '<div class="empty" style="color:#ef4444">加载失败</div>';
  });
}

// ═══ AI 异常检测 + 导出 ═══
function analyzeLedger(){
  var area = document.getElementById('analyze-area');
  area.innerHTML = '<div class="empty">AI 分析中…</div>';
  var ent = document.getElementById('ent-name').value.trim();
  fetch('/api/ledger/analyze', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({enterprise: ent})})
  .then(function(r){return r.json()})
  .then(function(d){
    if(!d.ok){ area.innerHTML=''; toast('分析失败：'+(d.error||'')); return; }
    if(!d.findings_count){
      area.innerHTML = '<div style="background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.3);border-radius:10px;padding:12px;font-size:13px">✅ 分析 '+d.analyzed+' 条记录，未发现异常。<div style="color:var(--muted);font-size:12px;margin-top:4px">'+(d.tips||[]).join('；')+'</div></div>';
      return;
    }
    var html = '<div style="border:1px solid rgba(245,158,11,.35);border-radius:10px;padding:12px;margin-bottom:10px">'
      + '<b style="font-size:13px;color:'+(d.high_count?'#ef4444':'#f59e0b')+'">🤖 AI 发现 '+d.findings_count+' 项异常（高危 '+d.high_count+' 项）</b>';
    d.findings.forEach(function(f){
      var c = f.level==='高' ? '#ef4444' : '#f59e0b';
      html += '<div style="margin-top:8px;padding:8px;background:rgba(0,0,0,.02);border-radius:8px;font-size:12px">'
        + '<b style="color:'+c+'">['+f.level+'·'+f.type+']</b> '+f.msg
        + '<div style="color:var(--muted);margin-top:2px">→ '+f.action+'</div></div>';
    });
    html += '</div>';
    area.innerHTML = html;
  })
  .catch(function(){ area.innerHTML=''; toast('网络异常'); });
}
function exportLedger(){
  var ent = document.getElementById('ent-name').value.trim();
  window.location.href = '/api/ledger/export?enterprise=' + encodeURIComponent(ent);
}

// ═══ 企业环保运行报告 ═══
function genReport(){
  var area = document.getElementById('report-area');
  area.innerHTML = '<div class="empty">报告生成中…</div>';
  fetch('/api/enterprise_report', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'})
  .then(function(r){return r.json()})
  .then(function(d){
    if(!d.ok){ area.innerHTML = '<div class="empty" style="color:#ef4444">'+(d.error||'生成失败')+'</div>'; return; }
    var htmlLink = d.html_url ? ' <a href="'+d.html_url+'" target="_blank" style="color:var(--g);font-size:13px">📄 专业版预览（可打印PDF）</a>' : '';
    area.innerHTML =
      '<div style="background:rgba(5,150,105,.06);border:1px solid rgba(5,150,105,.3);border-radius:10px;padding:14px;font-size:13px">'
      + '<b style="color:var(--g)">✅ 报告已生成（'+d.report_id+'）</b><br>'
      + '<span style="color:var(--muted);font-size:12px">'+d.summary+'</span><br>'
      + '<a href="'+d.download_url+'" download style="color:var(--b);font-size:13px">⬇ 下载报告（docx）</a>' + htmlLink
      + '</div>';
  })
  .catch(function(){ area.innerHTML = '<div class="empty" style="color:#ef4444">报告服务暂不可达</div>'; });
}

loadLedger();
</script>
<script src="voice-assistant.js"></script>
<script src="voice-coach.js"></script>
<script src="ai-assistant.js"></script>
</body>
</html>
